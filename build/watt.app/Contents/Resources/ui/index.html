<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>watt</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body {
  margin: 0;
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  width: 268px;
  height: auto;
  min-height: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

body.browser-mode {
  background: #0b1a12;
  align-items: center;
  overflow: auto;
  height: 100vh;
  width: 100vw;
}

/* ── CARD ── */
.card {
  width: 248px;
  background: linear-gradient(160deg, #0f2318 0%, #0a1a10 100%);
  border: 0.5px solid rgba(74,222,128,0.18);
  border-radius: 20px;
  padding: 14px 14px 12px;
  position: relative;
  overflow: visible;
  cursor: grab;
}
.card:active { cursor: grabbing; }

/* top shimmer line */
.card::before {
  content:'';
  position:absolute;
  top:0;left:20px;right:20px;
  height:0.5px;
  background: linear-gradient(90deg,transparent,rgba(74,222,128,0.45),transparent);
  border-radius:1px;
}

/* ── PET ZONE ── */
.pet-zone {
  position: relative;
  height: 88px;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 4px;
}

.pet-emoji {
  font-size: 54px;
  line-height: 1;
  filter: drop-shadow(0 6px 14px rgba(0,0,0,0.5));
  transition: filter 0.3s;
  display: block;
}

/* state animations */
.anim-happy    { animation: bounce 3s ease-in-out infinite; }
.anim-stressed { animation: shake 0.35s ease-in-out infinite; }
.anim-overload { animation: jitter 0.08s linear infinite; filter: drop-shadow(0 0 12px rgba(255,60,60,0.9)); }
.anim-sleeping { animation: breathe 4s ease-in-out infinite; }
.anim-pop      { animation: pop 0.35s cubic-bezier(.175,.885,.32,1.275); }

@keyframes bounce  { 0%,100%{transform:translateY(0)}   50%{transform:translateY(-8px)} }
@keyframes shake   { 0%,100%{transform:translateX(0)}   25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
@keyframes jitter  { 0%{transform:translate(0,0)} 25%{transform:translate(-2px,2px)} 50%{transform:translate(2px,-2px)} 75%{transform:translate(-2px,-2px)} }
@keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06) translateY(3px)} }
@keyframes pop     { 0%{transform:scale(1)} 50%{transform:scale(0.6) rotate(8deg)} 100%{transform:scale(1)} }

/* particles */
.particle {
  position:absolute;
  font-size:1.1rem;
  pointer-events:none;
  z-index:5;
  animation: floatUp 1.8s ease-out forwards;
}
@keyframes floatUp {
  0%   { opacity:0; transform:translateY(0) scale(0.5); }
  20%  { opacity:1; }
  100% { opacity:0; transform:translateY(-55px) scale(1.1); }
}

/* zzz */
.zzz {
  position:absolute;
  top:-8px; right:12px;
  font-size:1.3rem;
  opacity:0;
  pointer-events:none;
  animation: floatZzz 3s infinite linear;
}
@keyframes floatZzz {
  0%   { opacity:0; transform:translate(0,0) scale(0.5); }
  20%  { opacity:1; }
  80%  { opacity:1; }
  100% { opacity:0; transform:translate(18px,-36px) scale(1.2); }
}

/* ── SPEECH BUBBLE ── */
.bubble {
  position: absolute;
  bottom: 98px;
  left: 50%;
  transform: translateX(-50%) translateY(8px) scale(0.92);
  background: rgba(255,255,255,0.97);
  color: #1a3325;
  font-size: 11.5px;
  font-weight: 600;
  line-height: 1.45;
  padding: 9px 13px;
  border-radius: 14px;
  max-width: 190px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  z-index: 20;
  transition: all 0.35s cubic-bezier(.175,.885,.32,1.275);
  white-space: pre-line;
  box-shadow: 0 4px 16px rgba(0,0,0,0.22);
}
.bubble.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0) scale(1);
}
.bubble::after {
  content:'';
  position:absolute;
  bottom:-9px; left:50%; transform:translateX(-50%);
  border:9px solid transparent;
  border-top-color: rgba(255,255,255,0.97);
  border-bottom:none;
}

/* ── STATUS ROW ── */
.status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.pet-name {
  font-size: 14px;
  font-weight: 500;
  font-family: monospace;
  color: #d1fae5;
  letter-spacing: 0.01em;
}

.state-badge {
  font-size: 10.5px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 99px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.badge-happy    { background: rgba(16,163,127,0.2); color: #34d399; border: 0.5px solid rgba(52,211,153,0.35); }
.badge-stressed { background: rgba(251,191,36,0.2); color: #fbbf24; border: 0.5px solid rgba(251,191,36,0.35); }
.badge-overload { background: rgba(239,68,68,0.2);  color: #f87171; border: 0.5px solid rgba(239,68,68,0.35); }
.badge-sleeping { background: rgba(99,102,241,0.2); color: #a5b4fc; border: 0.5px solid rgba(165,180,252,0.35); }

/* ── DIVIDER ── */
.divider {
  border: none;
  border-top: 0.5px solid rgba(74,222,128,0.1);
  margin: 6px 0;
}

/* ── LLM ROW ── */
.llm-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 7px;
}

.llm-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  font-weight: 700;
  padding: 3px 9px 3px 7px;
  border-radius: 99px;
  letter-spacing: 0.03em;
}
.llm-chatgpt { background: rgba(16,163,127,0.15); color: #34d399; border: 0.5px solid rgba(16,163,127,0.3); }
.llm-gemini  { background: rgba(99,102,241,0.15); color: #a5b4fc; border: 0.5px solid rgba(99,102,241,0.3); }
.llm-claude  { background: rgba(213,130,70,0.15);  color: #fdba74; border: 0.5px solid rgba(213,130,70,0.3); }
.llm-offline { background: rgba(100,100,100,0.15); color: #9ca3af; border: 0.5px solid rgba(100,100,100,0.3); }

.conn-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
}

/* ── METRIC GRID ── */
.metric-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  margin-bottom: 6px;
}

.metric-cell {
  background: rgba(255,255,255,0.04);
  border: 0.5px solid rgba(74,222,128,0.1);
  border-radius: 10px;
  padding: 7px 9px;
}

.metric-label {
  font-size: 9px;
  color: #4b7a5e;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 3px;
}

.metric-val {
  font-size: 14px;
  font-weight: 700;
  color: #e2ffe9;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.metric-sub {
  font-size: 9px;
  color: #4b7a5e;
  font-weight: 500;
  margin-top: 2px;
}

/* ── POWER BAR ── */
.power-row {
  margin-bottom: 5px;
}

.power-label-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}

.power-label {
  font-size: 9.5px;
  color: #4b7a5e;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.power-val {
  font-size: 10.5px;
  font-weight: 700;
  color: #fbbf24;
  font-variant-numeric: tabular-nums;
}

.power-track {
  height: 5px;
  background: rgba(255,255,255,0.07);
  border-radius: 99px;
  overflow: hidden;
}

.power-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 0.6s ease, background 0.4s ease;
  width: 0%;
}

/* ── SESSION INFO ── */
.session-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.session-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 9.5px;
  color: #4b7a5e;
  font-weight: 500;
}

.session-val {
  color: #86efac;
  font-weight: 700;
}

/* ── REMINDER PILL ── */
.reminder-strip {
  margin-top: 8px;
  background: rgba(255,255,255,0.04);
  border: 0.5px solid rgba(74,222,128,0.12);
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 10.5px;
  color: #86efac;
  font-weight: 500;
  display: none;
  text-align: center;
  animation: fadeInUp 0.4s ease;
}
@keyframes fadeInUp {
  from { opacity:0; transform:translateY(4px); }
  to   { opacity:1; transform:translateY(0); }
}
</style>
</head>
<body>

<div class="card" id="card">
  <!-- speech bubble (above card, portal'd in CSS) -->
  <div class="bubble" id="bubble">Hello! 👋</div>

  <!-- pet -->
  <div class="pet-zone" id="petZone">
    <div class="zzz" id="zzz">Z</div>
    <span class="pet-emoji anim-happy" id="pet">😊</span>
  </div>

  <!-- status row -->
  <div class="status-row">
    <span class="pet-name">watt 🌿</span>
    <span class="state-badge badge-happy" id="stateBadge">Happy</span>
  </div>

  <hr class="divider">

  <!-- LLM chip + connection -->
  <div class="llm-row">
    <div class="llm-chip llm-offline" id="llmChip">
      <div class="conn-dot" id="connDot"></div>
      <span id="llmLabel">Proxy offline</span>
    </div>
    <span style="font-size:9.5px;color:#4b7a5e;font-weight:600;" id="sessionTime">0:00</span>
  </div>

  <!-- metric grid -->
  <div class="metric-grid">
    <div class="metric-cell">
      <div class="metric-label">⚡ Tokens</div>
      <div class="metric-val" id="mTokens">—</div>
      <div class="metric-sub" id="mTokenCo2">— g CO₂</div>
    </div>
    <div class="metric-cell">
      <div class="metric-label">🔋 Power</div>
      <div class="metric-val" id="mWatts">—</div>
      <div class="metric-sub" id="mLocalCo2">— g CO₂</div>
    </div>
    <div class="metric-cell">
      <div class="metric-label">📊 Total CO₂</div>
      <div class="metric-val" id="mTotalCo2">—</div>
      <div class="metric-sub">combined</div>
    </div>
    <div class="metric-cell">
      <div class="metric-label">🌡️ Intensity</div>
      <div class="metric-val" id="mIntensity">—</div>
      <div class="metric-sub">400 g/kWh</div>
    </div>
  </div>

  <!-- power bar -->
  <div class="power-row">
    <div class="power-label-row">
      <span class="power-label">⚡ Power draw</span>
      <span class="power-val" id="powerValLabel">0.0 W</span>
    </div>
    <div class="power-track">
      <div class="power-fill" id="powerFill"></div>
    </div>
  </div>

  <hr class="divider">

  <!-- session -->
  <div class="session-row">
    <div class="session-item">⏱ <span>Session</span> <span class="session-val" id="sessTokens">0</span> <span>tokens</span></div>
    <div class="session-item">💾 <span>CO₂ saved:</span> <span class="session-val" id="co2Saved">0.00g</span></div>
  </div>

  <!-- reminder -->
  <div class="reminder-strip" id="reminderStrip">💧 Drink some water!</div>
</div>

<script>
const pet = document.getElementById('pet');
const bubble = document.getElementById('bubble');
const stateBadge = document.getElementById('stateBadge');
const llmChip = document.getElementById('llmChip');
const llmLabel = document.getElementById('llmLabel');
const connDot = document.getElementById('connDot');
const mTokens = document.getElementById('mTokens');
const mTokenCo2 = document.getElementById('mTokenCo2');
const mWatts = document.getElementById('mWatts');
const mLocalCo2 = document.getElementById('mLocalCo2');
const mTotalCo2 = document.getElementById('mTotalCo2');
const mIntensity = document.getElementById('mIntensity');
const powerFill = document.getElementById('powerFill');
const powerValLabel = document.getElementById('powerValLabel');
const sessTokens = document.getElementById('sessTokens');
const co2Saved = document.getElementById('co2Saved');
const reminderStrip = document.getElementById('reminderStrip');
const sessionTime = document.getElementById('sessionTime');
const zzz = document.getElementById('zzz');
const card = document.getElementById('card');

if (!window.startWindowDrag) document.body.classList.add('browser-mode');

// ── state ──────────────────────────────────────────────
let currentEmotion = '';
let isSleeping = false;
let continuousActiveSeconds = 0;
let bubbleTimeout = null;
let tokenStats = null;
let sessionStartMs = Date.now();
let reminderSeconds = 0;
let lastTokenCount = 0;
let savedCo2 = 0;

const IDLE_SLEEP = 60;
const REMINDER_EVERY = 300; // 5 min

// ── emotions ────────────────────────────────────────────
const EMOTIONS = {
  happy:    { emoji:'🦘', label:'Happy',   badgeClass:'badge-happy',    particles:['🍃','✨'] },
  stressed: { emoji:'😓', label:'Stressed',badgeClass:'badge-stressed', particles:['⚡'] },
  overload: { emoji:'🔥', label:'Overload',badgeClass:'badge-overload', particles:['🔥'] },
  sleeping: { emoji:'💤', label:'Resting', badgeClass:'badge-sleeping', particles:[] },
};

function setEmotion(e) {
  if (currentEmotion === e) return;
  currentEmotion = e;
  const em = EMOTIONS[e];
  if (!em) return;

  pet.classList.remove('anim-happy','anim-stressed','anim-overload','anim-sleeping','anim-pop');
  void pet.offsetWidth;
  pet.classList.add('anim-pop');

  setTimeout(() => {
    pet.textContent = em.emoji;
    stateBadge.textContent = em.label;
    stateBadge.className = 'state-badge ' + em.badgeClass;
    zzz.style.display = e === 'sleeping' ? 'block' : 'none';
  }, 160);

  setTimeout(() => {
    pet.classList.remove('anim-pop');
    pet.classList.add('anim-' + (e === 'sleeping' ? 'sleeping' : e));
  }, 360);
}

// ── bubble ─────────────────────────────────────────────
function showBubble(text, ms = 5000) {
  bubble.textContent = text;
  bubble.classList.add('show');
  clearTimeout(bubbleTimeout);
  bubbleTimeout = setTimeout(() => bubble.classList.remove('show'), ms);
}

// ── particles ──────────────────────────────────────────
function spawnParticle() {
  if (isSleeping) return;
  const em = EMOTIONS[currentEmotion];
  if (!em || !em.particles.length) return;
  const p = document.createElement('div');
  p.className = 'particle';
  p.textContent = em.particles[Math.floor(Math.random()*em.particles.length)];
  p.style.left = (20+Math.random()*60)+'px';
  p.style.top  = (30+Math.random()*40)+'px';
  document.getElementById('petZone').appendChild(p);
  setTimeout(()=>p.remove(), 1800);
}
setInterval(spawnParticle, 900);

// ── LLM chip ───────────────────────────────────────────
const LLM_STYLES = {
  chatgpt: { cls:'llm-chatgpt', label:'ChatGPT' },
  gemini:  { cls:'llm-gemini',  label:'Gemini'  },
  claude:  { cls:'llm-claude',  label:'Claude'  },
  offline: { cls:'llm-offline', label:'Proxy offline' },
};

function setLLM(platform) {
  const s = LLM_STYLES[platform] || LLM_STYLES.offline;
  llmChip.className = 'llm-chip ' + s.cls;
  llmLabel.textContent = s.label;
}

// ── power bar ──────────────────────────────────────────
function setPowerBar(watts) {
  const MAX_W = 15;
  const pct = Math.min(100, (watts / MAX_W) * 100);
  powerFill.style.width = pct + '%';
  powerValLabel.textContent = watts.toFixed(1) + ' W';

  if (watts > 8)      powerFill.style.background = 'linear-gradient(90deg,#f87171,#ef4444)';
  else if (watts > 3) powerFill.style.background = 'linear-gradient(90deg,#fbbf24,#f59e0b)';
  else                powerFill.style.background = 'linear-gradient(90deg,#4ade80,#22c55e)';
}

// ── session clock ──────────────────────────────────────
function tickClock() {
  const elapsed = Math.floor((Date.now() - sessionStartMs) / 1000);
  const m = Math.floor(elapsed/60);
  const s = elapsed%60;
  sessionTime.textContent = m + ':' + String(s).padStart(2,'0');
}
setInterval(tickClock, 1000);

// ── reminders ──────────────────────────────────────────
const REMINDERS = [
  '💧 Drink some water!',
  '🧘 Take a deep breath',
  '👀 Look away from the screen for 20s',
  '🏃 Stand up and stretch!',
  '🌿 Touch some grass soon',
  '😴 Don\'t forget to blink!',
  '🍎 Time for a healthy snack?',
  '🪟 Open a window — fresh air!',
];
let reminderIdx = 0;

function showReminder() {
  const msg = REMINDERS[reminderIdx++ % REMINDERS.length];
  reminderStrip.textContent = msg;
  reminderStrip.style.display = 'block';
  showBubble(msg, 7000);
  setTimeout(()=>{ reminderStrip.style.display='none'; }, 8000);
}

// ── token poll ─────────────────────────────────────────
async function pollStats() {
  try {
    const r = await fetch('http://localhost:8888/stats', { cache:'no-store' });
    if (!r.ok) throw new Error();
    tokenStats = await r.json();
    // Use last_platform from backend for accurate LLM chip display
    const platform = tokenStats.last_platform || null;
    if (platform) setLLM(platform);
    else setLLM('offline');
  } catch { tokenStats = null; setLLM('offline'); }
}
pollStats();
setInterval(pollStats, 2500);

// ── gamification ───────────────────────────────────────
function processGamification(idleSeconds) {
  reminderSeconds++;
  if (reminderSeconds % REMINDER_EVERY === 0) showReminder();

  if (isSleeping && idleSeconds < 5) {
    isSleeping = false;
    continuousActiveSeconds = 0;
    savedCo2 += 0.0012; // rough credit for rest period
    co2Saved.textContent = savedCo2.toFixed(4) + 'g';
    showBubble('Welcome back! 🌿 A little rest helps the planet too!', 6000);
  }

  if (idleSeconds > IDLE_SLEEP) {
    if (!isSleeping) {
      isSleeping = true;
      showBubble('Going to sleep 💤 Saving power!', 5000);
    }
    return 'sleeping';
  }

  if (!isSleeping && idleSeconds < 5) continuousActiveSeconds++;
  return null;
}

// ── main update bridge ────────────────────────────────
window.updateMetrics = function(watts, co2Grams, idleSeconds) {
  const w = parseFloat(watts) || 0;
  const localCo2 = parseFloat(co2Grams) || 0;

  const totalTokens = tokenStats ? Number(tokenStats.total_tokens || 0) : 0;
  const tokenCo2    = tokenStats ? Number(tokenStats.total_co2_grams || 0) : 0;
  const totalCo2    = localCo2 + tokenCo2;

  // metrics
  mTokens.textContent    = totalTokens ? totalTokens.toLocaleString() : '—';
  mTokenCo2.textContent  = tokenCo2.toFixed(5) + ' g CO₂';
  mWatts.textContent     = w.toFixed(1) + ' W';
  mLocalCo2.textContent  = localCo2.toFixed(5) + ' g CO₂';
  mTotalCo2.textContent  = totalCo2.toFixed(5) + ' g';
  mIntensity.textContent = (totalCo2 * 1000).toFixed(3) + ' mg';

  setPowerBar(w);
  sessTokens.textContent = totalTokens.toLocaleString();

  // track new tokens for savings
  if (totalTokens > lastTokenCount) lastTokenCount = totalTokens;

  const forcedEmotion = processGamification(idleSeconds || 0);
  if (forcedEmotion) {
    setEmotion(forcedEmotion);
  } else {
    if      (w > 8  || tokenCo2 > 1.0) setEmotion('overload');
    else if (w > 3)                     setEmotion('stressed');
    else                                setEmotion('happy');
  }
};

// ── browser-mode demo loop ────────────────────────────
if (!window.startWindowDrag) {
  let tick = 0;
  setInterval(()=>{
    tick++;
    const w = 2 + Math.abs(Math.sin(tick/15)) * 9;
    window.updateMetrics(w, w*0.00012, tick%120 < 10 ? 70 : 2);
  }, 1000);
  setEmotion('happy');
  showBubble('Hi! I\'m watt 🌿 Tracking your AI footprint!', 7000);
}

// ── draggable (CSS fallback for browser mode) ─────────
let dragging = false, ox = 0, oy = 0;
card.addEventListener('mousedown', e => {
  if (window.startWindowDrag) { window.startWindowDrag(''); return; }
  dragging = true;
  ox = e.clientX - card.offsetLeft;
  oy = e.clientY - card.offsetTop;
  card.style.position = 'absolute';
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  card.style.left = (e.clientX - ox) + 'px';
  card.style.top  = (e.clientY - oy) + 'px';
});
document.addEventListener('mouseup', () => { dragging = false; });

// click pet for surprise bubble
pet.addEventListener('click', e => {
  e.stopPropagation();
  const surprises = [
    '🌍 Every token has a carbon cost!',
    '♻️ Short prompts = less CO₂',
    '🧠 I track your AI brain-power!',
    '💡 Tip: batch your questions',
    '🌱 You\'re more eco than yesterday!',
  ];
  showBubble(surprises[Math.floor(Math.random()*surprises.length)], 5000);
});

// init
setEmotion('happy');
zzz.style.display = 'none';
</script>
</body>
</html>
